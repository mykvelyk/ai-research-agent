services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: research-agent-interface
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://research:research@postgres:5432/research
      TELEGRAM_MODE: webhook
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: research-agent-worker
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://research:research@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
